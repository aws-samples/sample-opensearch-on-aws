server {
    listen 443 ssl;
    server_name $host;
    rewrite ^/$ https://$host/_dashboards redirect;

    # SSL configuration
    ssl_certificate           /etc/nginx/cert.crt;
    ssl_certificate_key       /etc/nginx/cert.key;

    ssl_session_cache  builtin:1000  shared:SSL:10m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;

    location ^~ /_dashboards {
        # Forward requests to OpenSearch Dashboards
        proxy_pass https://DOMAIN_ENDPOINT/_dashboards;

        # Update cookie domain and path
        proxy_cookie_domain DOMAIN_ENDPOINT $host;

        proxy_set_header Accept-Encoding "";
        sub_filter_types *;
        sub_filter DOMAIN_ENDPOINT $host;
        sub_filter_once off;

        # Response buffer settings
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # SSL verification for upstream OpenSearch connection
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_server_name on;
    }

    location / {
        # Forward all other requests to OpenSearch API
        proxy_pass https://DOMAIN_ENDPOINT/;
        proxy_set_header Host DOMAIN_ENDPOINT;
        proxy_pass_request_headers on;
        # Note: proxy_ssl_verify is off because OpenSearch domain uses AWS-managed certificates
        # that are not in the default CA bundle. The connection is still encrypted via HTTPS.
        # For production, consider adding the AWS CA bundle or using a custom certificate.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_server_name on;
    }
}
